<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TrackFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            text-align: center;
        }

        .login-title {
            font-size: 28px;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            text-align: left;
        }

        .error-msg {
            color: var(--red);
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            min-height: 20px;
            margin-top: -0.5rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="card glass-card login-card">
        <h1 class="login-title">TrackFlow</h1>
        <p class="login-subtitle">Inventory Management System</p>

        <div id="login-error" class="error-msg"></div>

        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" required placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required placeholder="Enter your password">
            </div>
            
            <button type="submit" class="btn-primary" style="margin-top: 1rem;">Login Securely</button>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
